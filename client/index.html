    <!-- Marketing attribution: records which channel (UTM tags / referring site)

if(!tagged){
if(d.cookie.indexOf(N+"=")>-1||!h)return;

else if(/(^|\.)bing\.com$/.test(h)){s="bing";m="organic"}
else if(/(^|\.)duckduckgo\.com$/.test(h)){s="duckduckgo";m="organic"}
else if(/(^|\.)yahoo\./.test(h)){s="yahoo";m="organic"}
else if(/(^|\.)(facebook\.com|fb\.com)$/.test(h)){s="facebook";m="social"}
else if(/(^|\.)instagram\.com$/.test(h)){s="instagram";m="social"}
else if(/^(t\.co|twitter\.com|x\.com|mobile\.twitter\.com)$/.test(h)){s="twitter";m="social"}
else if(/(^|\.)(linkedin\.com|lnkd\.in)$/.test(h)){s="linkedin";m="social"}
else if(/(^|\.)reddit\.com$/.test(h)){s="reddit";m="community"}
else if(/(^|\.)trustpilot\.com$/.test(h)){s="trustpilot";m="review"}
else if(/(^|\.)yelp\.com$/.test(h)){s="yelp";m="review"}
a.utm_source=s;a.utm_medium=m}
if(h)a.referrer=cut(h);
